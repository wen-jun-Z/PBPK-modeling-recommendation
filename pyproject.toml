[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pbpk-stage1-public-kb"
version = "0.1.0"
description = "Stage 1 public/reference PBPK knowledge base"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.7,<3.0",
  "pydantic-settings>=2.3,<3.0",
  "SQLAlchemy>=2.0,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "PyYAML>=6.0,<7.0",
  "pgvector>=0.3,<1.0",
  "streamlit>=1.37,<2.0",
  "pypdf>=4.0,<6.0",
  "PyMuPDF>=1.24,<2.0",
  "Pillow>=10.4,<12.0",
  "openpyxl>=3.1,<4.0",
  "xlrd>=2.0,<3.0",
  "python-docx>=1.1,<2.0",
  "python-pptx>=1.0,<2.0",
  "hachoir>=3.3,<4.0",
  "defusedxml>=0.7,<1.0",
  "httpx>=0.27,<1.0",
  "jsonschema>=4.0,<5.0",
]

[project.optional-dependencies]
blueprint = [
  "numpy>=1.26,<3.0",
  "scipy>=1.11,<2.0",
]
dev = [
  "httpx>=0.27,<1.0",
  "pytest>=8.2,<9.0",
  "pytest-cov>=5.0,<7.0",
]
embeddings = [
  "sentence-transformers>=3.0,<5.0",
]
recommendation = [
  "accelerate>=1.6,<2.0",
  "bitsandbytes>=0.45,<1.0; platform_system == 'Linux'",
  "gliner>=0.2.22,<1.0",
  "xgrammar==0.2.5.post1",
  "sentence-transformers>=3.0,<6.0",
  "torch>=2.5,<3.0",
  "torch-geometric>=2.6,<3.0",
  "threadpoolctl>=3.5,<4.0",
  "transformers>=4.57,<6.0",
  "xgboost>=3.0,<4.0",
  "rdkit>=2025.3,<2027.0",
]

[project.scripts]
pbpk-design-blueprint = "pbpk_kb.blueprints.design:main"
pbpk-stage1 = "pbpk_kb.main:main"
pbpk-model-assets = "pbpk_kb.model_assets.cli:main"
pbpk-model-kg = "pbpk_kb.graph.model_kg_cli:main"
pbpk-osp-windows-worker = "pbpk_kb.model_assets.windows_worker:main"
pbpk-runtime-repeatability = "pbpk_kb.model_runtime.repeatability:main"
pbpk-snapshot-reuse = "pbpk_kb.model_assets.licensed_snapshot_reuse:main"
pbpk-register-licensed-model = "pbpk_kb.model_assets.licensed_model_registration:main"
pbpk-prepare-licensed-model-kg = "pbpk_kb.model_assets.licensed_model_kg_input:main"
pbpk-project-licensed-model-graph = "pbpk_kb.recommendation.licensed_model_graph:main"
pbpk-import-licensed-model = "pbpk_kb.storage.import_licensed_model:main"
pbpk-import-public-model-catalog = "pbpk_kb.storage.import_public_model_catalog:main"
pbpk-build-caffeine-v5-blueprint = "pbpk_kb.blueprints.caffeine_v5_registration:main"
pbpk-import-executable-blueprint = "pbpk_kb.storage.import_executable_blueprint:main"
pbpk-model-matching-benchmark = "pbpk_kb.recommendation.model_matching.benchmark:main"
pbpk-train-model-matchers = "pbpk_kb.recommendation.model_matching.training:main"
pbpk-model-matching-statistics = "pbpk_kb.recommendation.model_matching.statistics:main"
pbpk-build-model-node-embeddings = "pbpk_kb.recommendation.model_matching.feature_store:main"
pbpk-train-model-lambdamart = "pbpk_kb.recommendation.model_matching.learning_to_rank:main"
pbpk-model-molecular-baselines = "pbpk_kb.recommendation.model_matching.molecular:main"
pbpk-build-molclr-features = "pbpk_kb.recommendation.model_matching.molecular_features:main"
pbpk-select-model-matcher-checkpoint = "pbpk_kb.recommendation.model_matching.checkpoint_selection:main"
pbpk-merge-model-matcher-seeds = "pbpk_kb.recommendation.model_matching.merge_parallel_seeds:main"
pbpk-promote-model-matcher = "pbpk_kb.recommendation.model_matching.promotion:main"
pbpk-resolve-model-compound-structures = "pbpk_kb.recommendation.model_matching.structure_resolver:main"
pbpk-model-matching-gold = "pbpk_kb.recommendation.model_matching.gold_benchmark:main"
pbpk-evaluate-model-simulations = "pbpk_kb.recommendation.model_matching.simulation_validation:main"
pbpk-census-public-model-repositories = "pbpk_kb.recommendation.model_matching.repository_census:main"
pbpk-census-public-model-versions = "pbpk_kb.recommendation.model_matching.repository_version_census:main"
pbpk-build-execution-benchmark = "pbpk_kb.recommendation.model_matching.execution_benchmark:main"
pbpk-plan-snapshot-validation = "pbpk_kb.recommendation.model_matching.snapshot_protocol_planner:main"
pbpk-build-windows-snapshot-batch = "pbpk_kb.recommendation.model_matching.windows_snapshot_batch:main"
pbpk-audit-windows-snapshot-batch = "pbpk_kb.recommendation.model_matching.execution_audit_batch:main"
pbpk-run-execution-ranking-baselines = "pbpk_kb.recommendation.model_matching.execution_experiment:main"
pbpk-plan-controlled-adaptations = "pbpk_kb.recommendation.model_matching.adaptation_planner:main"
pbpk-integrate-controlled-adaptations = "pbpk_kb.recommendation.model_matching.adaptation_integration:main"
pbpk-plan-scenario-perturbations = "pbpk_kb.recommendation.model_matching.perturbation:main"
pbpk-evaluate-scenario-perturbations = "pbpk_kb.recommendation.model_matching.perturbation_evaluation:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["pbpk_kb*"]

[tool.setuptools.package-data]
"pbpk_kb.model_runtime" = ["R/*.R"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"
